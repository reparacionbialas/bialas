<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIALAS PRO</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0f172a;color:#fff;padding:12px}
h1{text-align:center;color:#22c55e;margin:8px 0 2px}
p.sub{text-align:center;color:#94a3b8;margin:0 0 14px;font-size:13px}
.card{background:#1e293b;border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;margin:10px 0 4px;font-weight:bold;font-size:14px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px}
textarea{min-height:70px}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#22c55e;color:#000;font-weight:bold;font-size:16px;margin-top:12px;cursor:pointer}
button.sec{background:#334155;color:#fff}
.row{display:flex;gap:10px}.row>div{flex:1}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.badge.ingresado{background:#facc15;color:#000}.badge.reparando{background:#38bdf8;color:#000}.badge.listo{background:#22c55e;color:#000}.badge.entregado{background:#94a3b8;color:#000}
.item{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;margin-bottom:10px}
.item b{font-size:16px}
.small{color:#94a3b8;font-size:13px}
/* PATRON */
#patronBox{display:none;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;text-align:center;margin-top:10px}
#grid{display:grid;grid-template-columns:repeat(3,70px);gap:18px;justify-content:center;margin:12px auto;touch-action:none}
.dot{width:70px;height:70px;border-radius:50%;background:#1e293b;border:3px solid #64748b;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;user-select:none}
.dot.active{background:#22c55e;border-color:#22c55e;color:#000}
#patronTexto{font-size:18px;letter-spacing:4px;margin:8px 0;color:#22c55e}
#claveBox{display:none}
</style>
</head>
<body>
<h1>BIALAS PRO</h1>
<p class="sub">Sistema de Reparación - Panambí, Misiones</p>

<div class="card">
<h2 style="margin:0">📱 Nueva Reparación</h2>

<label>Cliente</label>
<input id="cliente" placeholder="Nombre del cliente">

<label>Teléfono</label>
<input id="telefono" placeholder="Ej: 3755...">

<div class="row">
<div><label>Equipo</label>
<select id="equipo"><option>Celular</option><option>Tablet</option><option>Notebook</option><option>Otro</option></select></div>
<div><label>Marca</label><input id="marca" placeholder="Samsung, Xiaomi..."></div>
</div>

<label>Modelo</label>
<input id="modelo" placeholder="Ej: A12, Redmi Note 13">

<label>Falla / Qué le pasa</label>
<textarea id="falla" placeholder="No enciende, pantalla rota..."></textarea>

<label>🔓 Tipo de desbloqueo</label>
<select id="tipoDesbloqueo" onchange="cambioDesbloqueo()">
<option value="Sin clave">Sin clave</option>
<option value="Patrón">Patrón</option>
<option value="PIN">PIN</option>
<option value="Clave">Clave / Contraseña</option>
</select>

<!-- CAJA PIN / CLAVE -->
<div id="claveBox">
<label id="claveLabel">Clave del cliente</label>
<input id="claveTexto" placeholder="Escribí la clave acá" inputmode="numeric">
</div>

<!-- CAJA PATRON DIBUJABLE -->
<div id="patronBox">
<b>Diseñá el patrón</b><br>
<span class="small">Tocá los puntitos en orden, como en el celu</span>
<div id="grid"></div>
<div>Patrón guardado:</div>
<div id="patronTexto">—</div>
<button type="button" class="sec" onclick="borrarPatron()">↻ Borrar y dibujar de nuevo</button>
</div>

<label>Precio estimado $</label>
<input id="precio" type="number" placeholder="0">

<button onclick="guardar()">✅ GUARDAR REPARACIÓN</button>
</div>

<div class="card">
<h2 style="margin:0 0 10px">📋 Reparaciones Guardadas</h2>
<div id="lista"></div>
<button class="sec" onclick="borrarTodo()">🗑 Borrar todo</button>
</div>

<script>
let patron = [];
let dibujando = false;

// Crear 9 puntitos
const grid = document.getElementById('grid');
for(let i=1;i<=9;i++){
  let d=document.createElement('div');
  d.className='dot'; d.textContent='•'; d.dataset.n=i;
  d.addEventListener('pointerdown', e=>{ dibujando=true; agregarPunto(d); e.preventDefault(); });
  d.addEventListener('pointerenter', e=>{ if(dibujando) agregarPunto(d); });
  grid.appendChild(d);
}
document.addEventListener('pointerup', ()=> dibujando=false);

function agregarPunto(d){
  let n = d.dataset.n;
  if(!patron.includes(n)){
    patron.push(n);
    d.classList.add('active');
    document.getElementById('patronTexto').textContent = patron.join(' - ');
  }
}
function borrarPatron(){
  patron=[];
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  document.getElementById('patronTexto').textContent='—';
}

function cambioDesbloqueo(){
  let tipo = document.getElementById('tipoDesbloqueo').value;
  let claveBox = document.getElementById('claveBox');
  let patronBox = document.getElementById('patronBox');
  claveBox.style.display='none';
  patronBox.style.display='none';
  borrarPatron();
  if(tipo==='Patrón'){ patronBox.style.display='block'; }
  if(tipo==='PIN'){
    claveBox.style.display='block';
    document.getElementById('claveLabel').textContent='PIN del cliente';
    document.getElementById('claveTexto').placeholder='Ej: 1234';
    document.getElementById('claveTexto').inputMode='numeric';
  }
  if(tipo==='Clave'){
    claveBox.style.display='block';
    document.getElementById('claveLabel').textContent='Clave / Contraseña del cliente';
    document.getElementById('claveTexto').placeholder='Escribí la clave';
    document.getElementById('claveTexto').inputMode='text';
  }
}

function guardar(){
  let tipo = document.getElementById('tipoDesbloqueo').value;
  let claveFinal = '';
  if(tipo==='Patrón') claveFinal = 'Patrón: ' + (patron.length? patron.join('-') : 'sin dibujar');
  if(tipo==='PIN' || tipo==='Clave') claveFinal = tipo + ': ' + document.getElementById('claveTexto').value;

  let rep = {
    cliente: document.getElementById('cliente').value,
    telefono: document.getElementById('telefono').value,
    equipo: document.getElementById('equipo').value,
    marca: document.getElementById('marca').value,
    modelo: document.getElementById('modelo').value,
    falla: document.getElementById('falla').value,
    tipo: tipo,
    clave: claveFinal,
    precio: document.getElementById('precio').value,
    estado: 'Ingresado',
    fecha: new Date().toLocaleString('es-AR')
  };
  if(!rep.cliente){ alert('Poné el nombre del cliente'); return; }
  let lista = JSON.parse(localStorage.getItem('bialas')||'[]');
  lista.unshift(rep);
  localStorage.setItem('bialas', JSON.stringify(lista));
  alert('Guardado ✅');
  // limpiar
  document.getElementById('cliente').value='';
  document.getElementById('telefono').value='';
  document.getElementById('marca').value='';
  document.getElementById('modelo').value='';
  document.getElementById('falla').value='';
  document.getElementById('claveTexto').value='';
  document.getElementById('precio').value='';
  borrarPatron();
  mostrar();
}

function mostrar(){
  let lista = JSON.parse(localStorage.getItem('bialas')||'[]');
  let html='';
  if(lista.length===0) html='<p class="small">Todavía no hay reparaciones.</p>';
  lista.forEach((r,i)=>{
    html+=`<div class="item">
    <b>${r.cliente}</b> - ${r.marca} ${r.modelo} (${r.equipo})<br>
    <span class="small">${r.fecha} - ${r.telefono}</span><br>
    Falla: ${r.falla}<br>
    🔓 ${r.tipo} ${r.clave? ' - '+r.clave : ''}<br>
    💰 $${r.precio||'0'}<br>
    <span class="badge ingresado">${r.estado}</span>
    <div class="row" style="margin-top:8px">
    <div><button class="sec" style="margin:0" onclick="cambiarEstado(${i},'Reparando')">Reparando</button></div>
    <div><button class="sec" style="margin:0" onclick="cambiarEstado(${i},'Listo')">Listo</button></div>
    <div><button class="sec" style="margin:0" onclick="cambiarEstado(${i},'Entregado')">Entregado</button></div>
    </div>
    <button class="sec" style="background:#7f1d1d" onclick="eliminar(${i})">Eliminar</button>
    </div>`;
  });
  document.getElementById('lista').innerHTML=html;
}
function cambiarEstado(i,estado){
  let lista=JSON.parse(localStorage.getItem('bialas')||'[]');
  lista[i].estado=estado;
  localStorage.setItem('bialas',JSON.stringify(lista));
  mostrar();
}
function eliminar(i){
  if(!confirm('¿Eliminar esta reparación?')) return;
  let lista=JSON.parse(localStorage.getItem('bialas')||'[]');
  lista.splice(i,1);
  localStorage.setItem('bialas',JSON.stringify(lista));
  mostrar();
}
function borrarTodo(){
  if(!confirm('¿Borrar TODO?')) return;
  localStorage.removeItem('bialas'); mostrar();
}
mostrar();
</script>
</body>
</html>
